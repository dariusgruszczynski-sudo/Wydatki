services:
  wydatki:
    build: .
    image: wydatki:latest
    container_name: wydatki
    restart: unless-stopped
    # Adres nasłuchu ustawiasz zmienną BIND w pliku .env:
    #   BIND=0.0.0.0:8090       -> dostęp po IP:porcie (http://46.225.229.113:8090)
    #   BIND=127.0.0.1:8090     -> tylko lokalnie, pod reverse proxy (nginx/traefik)
    ports:
      - "${BIND:-127.0.0.1:8090}:3000"
    environment:
      # WYMAGANE: wspólny PIN do logowania.
      APP_PIN: "${APP_PIN:?Ustaw APP_PIN w pliku .env}"
      # Sekret do podpisu ciasteczka sesji (dowolny długi losowy ciąg).
      SESSION_SECRET: "${SESSION_SECRET:?Ustaw SESSION_SECRET w pliku .env}"
      # Ile dni trzymać zalogowanie.
      SESSION_DAYS: "30"
      # Ustaw na 1 jeśli serwujesz po HTTPS (ciasteczko tylko przez TLS).
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      DATA_DIR: "/data"
    volumes:
      - wydatki_data:/data

volumes:
  wydatki_data:
